[project]
name = "ne-meridian"
version = "0.1.0"
description = "Deterministic Meridian Bank synthetic corpus and ground truth (BD-1)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ne-acme",
    "ne-schema",
    "pydantic>=2.13.4,<3",
]

[project.scripts]
ne-meridian = "ne.meridian.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ne.meridian"
namespace = true
data = { data = "fixtures" }

[tool.uv.sources]
ne-acme = { workspace = true }
ne-schema = { workspace = true }
