#
# StatefulSet reproduction of deploy/compose/pilot/compose.yaml's keycloak
# service: same `start --http-enabled true --proxy-headers xforwarded` args,
# host-based KC_HOSTNAME (no :8443 — the Ingress controller terminates TLS).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: neutron-enterprise
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: neutron-enterprise
    spec:
      securityContext:
        {{- include "neutron.podSecurityContext" (dict "uid" 1000 "gid" 1000 "openshift" .Values.global.openshift) | nindent 8 }}
      containers:
        - name: keycloak
          image: {{ include "neutron.imageRef" (dict "registry" .Values.global.imageRegistry "repository" .Values.image.repository "tag" .Values.image.tag "digest" .Values.image.digest) }}
          args:
            - "start"
            - "--http-enabled"
            - "true"
            - "--proxy-headers"
            - "xforwarded"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          securityContext:
            {{- include "neutron.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.secretName }}
                  key: NE_PILOT_KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HOSTNAME
              value: https://{{ include "neutron.keycloakHost" . }}
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: ne
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.secretName }}
                  key: NE_PILOT_POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
