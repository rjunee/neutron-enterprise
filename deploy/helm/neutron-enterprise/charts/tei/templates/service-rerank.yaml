# ClusterIP `tei-rerank` — port 80 → targetPort 8080 (same non-root pod-port
# mapping as tei-embed; the reranker is reached at http://tei-rerank:80).
apiVersion: v1
kind: Service
metadata:
  name: tei-rerank
  labels:
    app: tei-rerank
    app.kubernetes.io/name: tei-rerank
    app.kubernetes.io/part-of: neutron-enterprise
spec:
  type: ClusterIP
  selector:
    app: tei-rerank
  ports:
    - name: http
      port: 80
      targetPort: 8080
