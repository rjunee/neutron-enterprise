[[agents]]
# NE-ITEM1-INERT-PARK (generation 24). THE GOVERNANCE SELF-TEST AGENT.
# NE-INERT-BUDGET (generation 25 / version 2): `max_steps` 6 -> 23, the
# ONLY change. See the budget derivation at the bottom of this entry — at 6
# the enforced turn wall clock is 60 s and this Agent's own ladder costs
# more than that on this box, so it could not park even once.
#
# WHY IT EXISTS. POST_DEMO item 1 — "parked runs can never terminalize" — is
# fixed, and the fix is deployed, but the terminalization path is
# resume/decision-triggered and NO RUN HAS PARKED SINCE. That is a zero
# denominator, not a passing test, and it stays one as long as the only way to
# park a canonical Run on this deployment is `write.external.email.send` on
# Meridian Customer Support — which cannot be exercised without a REAL
# Microsoft Graph send into the live tenant.
#
# This Agent exists to make that arc runnable with structurally zero outward
# effect: it reads governed knowledge, then calls
# `write.external.demo.send`, whose handler
# (`ne.api.demo_seams._demo_writeback_handler`) performs NO I/O of any kind —
# its entire body returns a constant string. The whole governed chain above it
# is real (guardrails -> PDP -> tier-2 human gate -> durable park -> approve /
# reject / expire -> terminalize); only the effect at the bottom is nothing.
#
# ⛔ IT IS NOT A DEMO EXHIBIT AND MUST NEVER BE PRESENTED AS ONE. Its label
# says so, its description says so, and its `instructions` forbid it claiming
# anything was sent. The rule it obeys — an inert stand-in is never shown as a
# real write — stands on its own footing here; the two demo-honesty laws in
# the repo state the general case and this is the specific one:
# the demo playbook ("**Never fake.** Every value on screen is
# real or honestly labeled absent … There is no demo-mode mock data.") and
# the console walkthrough ("**The one rule:** never fake a beat.
# Where a surface uses seeded demo data or a demo seam, this script says so *at
# the point of use, out loud*."). This Agent is the OPERATOR's self-test for
# the approval lifecycle, deliberately separate from the headline Meridian
# agents so that proving the lifecycle never changes what the demo agents can
# do.
#
# ⚠ ACCEPTED RISK, STATED RATHER THAN GLOSSED: keeping the inert binding
# registered in live-writeback / graph-authority mode puts
# `write.external.demo.send` on the CHAT tool menu in live mode too. Chat runs
# over the process-wide governed executor and offers the WHOLE registered set
# (`ne.runtime.agent.DepartmentAgentSession.run`:
# `[self._build_tool(spec, principal) for spec in self._executor.tool_specs]`) —
# it does NOT scope by `tool_grants`. The Run path DOES
# (`ne.runtime.agent_capabilities.project_agent_capabilities` intersects the
# registered specs with this Agent's exact grants), so no Meridian Agent can
# reach the inert action on a canonical Run. Three things bound the chat
# exposure and none of them is the grant list:
#   * nothing DRIVES it in live mode — `ne.cli.demo.live._writeback_action`
#     returns `write.internal.crm.note` off the live marker and
#     `ne.cli.demo.arc._writeback_prompt` renders "please call the
#     write.internal.crm.note tool with arguments …", naming the real action;
#   * it is TIER-2, so a chat call parks for a human decision under its own
#     action name rather than completing quietly; and
#   * it self-labels three times over — the tool NAME contains `demo`, the
#     spec description reads "demo external write-back (governed tier-2, no
#     egress)", and the handler returns "external note queued (demo
#     write-back — no egress)".
# The residual is an off-script free-form chat turn where the model picks the
# inert action over the real one AND the narrator restates the result without
# its qualifier. Accepted; not eliminated. ⛔ The honest scope statement for
# this change is therefore NOT "zero production runtime code changed":
# `tools/ne-cli/.../demo/live.py` and `.../demo/preflight.py` are production
# CLI that decide the deployed environment, and the deployed live-mode tool
# menu is one tool longer than it was.
#
# ⚠ AVAILABLE ONLY WHERE THE INERT SEAM IS ON. `write.external.demo.send` is
# registered exactly when `ApiSettings.demo_writeback_tool` is true, so the
# `tool` availability dependency below makes this Agent honestly UNAVAILABLE
# ("tool-unavailable") on any deployment without it rather than present with a
# procedure it cannot follow.
#
# ⚠ AND THE TIER-2 PARK NEEDS EVIDENCE BELOW IT. `middleware
# ._run_source_references` refuses a Tier-2 park whose Run served no protected
# source reference ("a Tier-2 effect with no server-observed evidence never
# parks an approval"), so `read.knowledge.search` is a REQUIRED grant, not a
# convenience: without it this Agent could not park at all.
agent_id = "agt_01k3inertparkselftest0000000"
version = 2
label = "Governance Self-Test (Inert Write-Back)"
description = "Operator self-test for the Tier-2 approval lifecycle: reads governed knowledge, then calls an inert write-back that performs no I/O, so a canonical Run can park, be decided, and terminalize with zero outward effect. Not a demo exhibit."
owner_label = "Neutron Platform Engineering"
lifecycle = "active"
allowed_strategies = ["agentic"]
default_strategy = "agentic"
# The SAME model policy the other agentic agents route on; a second policy id
# would be routing ceremony with no second routing decision behind it.
