# History increments: a tool turn adds t + C = 1380; the retry stage adds
# (t + R_res) = 252, then 34 x (W + R_wrap) = 786 each, then 4 x (F + R_shape)
# = 4242, then (F + R_claim) = 4403 — the classes in the order
# `_OUTPUT_RETRY_ALLOWANCES` enumerates them, which is the sequence every
# derivation in this file uses (residue, wrapped calls, the WHOLE
# `answer-shape` allowance, then rejected claims, then the served answer).
# A FIFTH shape rejection ends the run rather than borrowing the reserved
# claim-contract slot, which is what keeps the composition the worst one.
#
# ⚠ RECORDED, NOT FIXED: the enumerated order is not the most EXPENSIVE
# INTERLEAVING. Because each increment is re-paid by every LATER retry request,
# the costliest permutation is the one that carries the largest increments
# longest — descending, i.e. claim first. Nothing in the ledger forbids it: the
# classes are charged per attempt and the model chooses the order. At the
# 1/4/1 composition this convention understated by 20755 (1.6%) and every pin
# in this file was written against it; the `wrapped-call` class widens the gap
# to 631905 (17%) for this Agent. That is a defect of the shared convention,
# not of this change, and re-cutting it belongs in one pass over all four
# derivations rather than smuggled in here. The number is written down so the
# choice is visible.
#
# ⭐ NE-WRAPPED-CALL-FUNDED (2026-09-11) ADDED THE LADDER-SIZED `wrapped-call`
# CLASS, so every figure below is re-derived rather than adjusted. The pool is
# now 1 + `max_tool_calls` + 4 + 1 = 40 for this Agent, and the request ceiling
# `2*max_tool_calls + 7` = 75. Leaving the budget at the 6-retry figure would
# have replaced a legible `AgentOutputContractError` (which still carries
# `sole=tool-call`) with a `budget_exhausted`/`tokens` terminal that names the
# wrong cause — strictly worse than the failure being fixed. The carried
# increments are therefore 252, then 786 per wrapped round to 26976, then 4242
# per shape round to 43944, then 4403 to 48347.
#
#   requests 1..34  (tool-reading)  sum(S + k*1380 for k in 0..33)
#                                   = 34*3358 + 1380*561
#                                   = 114172 + 774180       =   888352
#   request 35      (first answer)  S + 34*1380 = 3358 + 46920 =  50278
#   requests 36..75 (the 40 retries) each re-pay 50278 plus every increment
#                                   carried so far. Written as the four stages
#                                   rather than 40 lines:
#                                     residue     1 req  carried 252
#                                                        = 50530
#                                     wrapped    34 reqs carried 252 + 786n,
#                                                        n = 1..34, last 26976
#                                                        = 77254
#                                     shape       4 reqs carried +4242 each,
#                                                        last 43944 = 94222
#                                     claim       1 req  carried 48347
#                                                        = 98625
#                                   40*50278 = 2011120, plus the carried sums
#                                   675161                 =  2686281
#   INPUT                                                       3624911
#   OUTPUT  34*t + t + 34*W + 6F
#           = 2720 + 80 + 14926 + 24000                  =        41726
#   TOTAL                                                       3666637
# minus the 4000 output budget leaves the figure below.
#
# CROSS-CHECK, because a number this large has to be attributable rather than
# plausible. It is two separate moves, each attributable on its own.
#   NE-MULTIHOP-FANOUT (10 -> 34 tool calls, at S = 2543) added 973752 over the
#   previous 249855, and every token of it is one of the 24 added tool calls:
#     the 24 new tool-reading requests   sum(S + k*1380 for k in 10..33)
#                                        = 24*2543 + 1380*516 = 773112
#     24 more tool turns of history, re-paid by each of the 6 final-answer-stage
#     requests                           6 * 24 * 1380        = 198720
#     24 more tool_call outputs          24 * 80              =   1920
#                               773112 + 198720 + 1920        = 973752  exactly.
#   NE-LANE-CHOICE + NE-ROWS-ARE-NOT-QUOTABLE + NE-WINDOW-ENDPOINTS add 23636 on
#   top, and every token of it is one of two things:
#     the fixed prompt re-sent, 40 requests x (3132 - 2543)  = 23560
#     the re-derived claim-retry slot, once           (403 - 327) =    76
#                             1223607 + 23636              = 1247243.
#   NE-CS-SPLIT then subtracts exactly the revoked prompt text and nothing else:
#     the fixed prompt re-sent, 40 requests x (3132 - 2916)  = -8640
#                             1247243 - 8640               = 1238603.
#   NE-ANALYST-INSTRUCTIONS then adds exactly the new manifest instructions and
#   nothing else:
#     the fixed prompt re-sent, 40 requests x (3090 - 2916)  = +6960
#                             1238603 + 6960               = 1245563.
#   NE-ANSWER-THE-QUESTION then adds exactly the new prompt text and nothing
#   else:
#     the fixed prompt re-sent, 40 requests x (3299 - 3090)  = +8360
#                             1245563 + 8360               = 1253923.
#   NE-GRAPH-ANCHOR then adds exactly the grown graph_path entry and nothing
#   else:
#     the fixed prompt re-sent, 40 requests x (3358 - 3299)  = +2360
#                             1253923 + 2360               = 1256283.
#   NE-SHAPE-ALLOWANCE-4 then adds exactly ONE MORE `answer-shape` retry and
#   nothing else — no tool call, no grant, no prompt text, S unchanged:
#     the added retry request itself    S + 34*1380 + 17052   = +67330
#     the claim-contract retry re-pays one more shape increment = +4200
#     one more final answer written     F                     =  +4000
#                             1256283 + 75530              = 1331813.
#   NE-WRAPPED-CALL-FUNDED is TWO moves, each attributable on its own.
#   (a) R_shape 200 -> 242, the measured correction. It touches only the four
#       shape increments and what re-pays them: +42, +84, +126, +168 on the
#       four shape retries and +168 on the claim retry
#                             1331813 + 588                = 1332401.
#       (Independent of the tool count: it is +588 on all four derivations.)
#   (b) the `wrapped-call` class itself, 34 rounds at W + R_wrap = 786:
#       the 34 new retry requests   sum(50278 + 252 + 786n for n in 1..34)
#                                   = 34*50530 + 786*595   = 2185690
#       the 4 shape + 1 claim retries each re-pay the whole wrapped block
#                                   5 * 786 * 34           =  133620
#       34 wrapped replies written as output  34 * W = 34*439 =  14926
#                             1332401 + 2334236            = 3666637.
# No tool call was added, no grant changed, S is unchanged and no allowance
# other than `wrapped-call` moved, which is the check that the ceiling was
# COSTED rather than the budget rounded up around it.
max_input_tokens = 3662637
# Held at 4000 deliberately: this is what the run may spend on model OUTPUT, and
# the serving lane's own `max_output_tokens` is being raised separately. Do not
# raise it past what the lane can actually serve.
max_output_tokens = 4000
# LANE HEADROOM, stated plainly.
#
# The largest SINGLE request is S + 34*(t+C) + all forty retry increments =
# 3358 + 46920 + 48347 = 98625 tokens.
#   PRIMARY LANES: VIABLE, with room. `frontier-default` and `private-default`
#   both declare 262144 with a 24576 output reserve and a 13108 margin, i.e.
#   224460 input tokens. 98625 leaves 125835 unspent. The frontier lane this
#   Agent is primaried on for the live demo serves the worst case whole.
#
#   32768-WINDOW FALLBACK LANES (`cpu-model`, and `private-default` on the sealed
#   CPU box): NOT VIABLE, and this is a change in KIND, not a shrinking margin.
#   Those lanes allow 27033 input tokens. Two ceilings ago only the RETRY
#   worst case (33522) passed that; an ordinary tool-reading request never did.
#   At 34 tool calls an ORDINARY request passes it too — request k costs
#   S + (k-1)*1380, which reaches 28198 at k = 19 — so such a run stops being
#   servable around its 19th tool call, mid-traversal.
#   What absorbs that is unchanged and is not new machinery: the gateway's budget
#   pre-flight (design §3.3) SKIPS a candidate that cannot serve the request, and
#   the runtime's own context trim (design §3.5) drops middle history rather than
#   serving a lie. Neither yields a COMPLETE population answer.
#   The honest statement is therefore: the DR-4830 multi-hop question is a
#   262144-window question. On a 32768-window lane it is not completely
#   answerable at ANY budget, because 32 single-key reads of accumulated history
#   do not fit that window. Shorter questions (B2, B3 — 1-2 reads) are unaffected
#   and still run on every lane.
#
# This does NOT make the Agent unbounded. `max_tool_calls = 34`, the request
# ceiling derived from it, and the 400s wall clock are all still hard ceilings; a
# runaway run stops, named, exactly as before. Growing the tool menu, the retry
# count, or this ceiling again needs this whole block re-derived, not extended.

[[agents]]
# NE-CS-SPLIT + NE-CS-SEND (owner decisions 2026-08-27): the drafting-and-
# outreach half of the old Analyst, running the REAL governed action ladder.
# This agent exists to run ONE workflow end to end: identify a single
# customer/loan from served evidence, draft hardship outreach under the pinned
# Skill procedure (a real unsent M365 draft, Tier-0), and on the follow-up turn
# REALLY send it (Tier-2 — the run parks at waiting_approval until a distinct
# human approver releases it).
# ⛔ THE APPROVED SEND IS THE LAST THING THE RUN DOES, and generation 24 stops
# claiming otherwise. A resume executes exactly the ONE pinned effect a human
# approved and terminalizes (`approved_effect_complete`); it does not re-enter
# the agent loop, which the architecture scopes as "DETERMINISTIC AND BOUNDED AGENTIC
# PRIMITIVES ONLY — NOT BUILT AS A GENERAL DURABLE LOOP". So nothing ordered
# AFTER the gated send can run. Skill v2's step 6 ordered a Salesforce contact
# note there and was therefore structurally unreachable: the platform told the
# model to do something it then made impossible. Skill v3 ends at the send, and
# every count and claim below is re-derived against that.
# NE-CS-WHOLE-LADDER (generation 19 / version 3, owner decision 2026-08-28)
# extends the FRONT of that ladder: the agent now holds the Analyst's five
# hardship verified-answer templates, so the same run first ESTABLISHES the
# loan's hardship eligibility — county of residence against the declared
# disaster counties, the payments-due window, and the repossession /
# prior-hardship-offer check — instead of refusing the whole ask for want of
# them (which is exactly what it did, correctly, when asked about mer-loan-001
# without this lane).
# Version 6 / generation 27 (NE-WRAPPED-CALL-FUNDED): the output-retry pool
# gained the ladder-sized `wrapped-call` class, so `model_request_limit(17)`
# moved 24 -> 41 and this budget — DERIVED from that ceiling — is re-derived
# below (530959 -> 1194989). ⛔ `max_steps` is NOT touched: 23 is the subtrahend
# of the published 180 s approval window (420 - 230 - 10) and moving it in
# either direction moves a governed, published claim.
agent_id = "agt_01k3customersupport000000000"
version = 6
label = "Meridian Customer Support"
description = "Establishes disaster-hardship eligibility for one Meridian loan from governed verified-answer templates, drafts the outreach (a real unsent M365 draft), then with per-item human approval really sends it. The approved send is the last step: the resumed run performs it and ends. Sends reach only the deployment's allow-listed recipient."
owner_label = "Meridian Servicing Operations"
lifecycle = "active"
allowed_strategies = ["agentic"]
default_strategy = "agentic"
# The SAME model policy as the Analyst, deliberately: this agent runs on the same
# serving lane, and a second policy id would be routing ceremony with no second
# routing decision behind it (the gateway's task map carries exactly this id).
model_policy_id = "agent.meridian-analyst.v2"
# EVERY grant is one the workflow reads or writes; nothing speculative.
