#   C  = 1300, t = 80, F = 4000, R_res = 172, R_claim = 403 — all unchanged
#              (same retrieval_top_k, same transport, same retry messages).
#   W  = 439, R_wrap = 347, R_shape = 242 — the three NE-WRAPPED-CALL-FUNDED
#              figures, MEASURED once in the Analyst's block above and used
#              verbatim here: they are properties of the transport and of the
#              two static correction strings, not of any one agent's catalog.
#   requests 1..17  (tool-reading)  sum(S + k*1380 for k in 0..16)
#                                   = 17*3871 + 1380*136
#                                   = 65807 + 187680         =   253487
#   request 18      (first answer)  S + 17*1380 = 3871 + 23460 =  27331
#   requests 19..41 (the 23 retries) each re-pay 27331 plus every increment
#                                   carried so far, in the four stages the
#                                   Analyst's block sets out:
#                                     residue     1 req  carried 252   = 27583
#                                     wrapped    17 reqs +786 each,
#                                                        last 13614    = 40945
#                                     shape       4 reqs +4242 each,
#                                                        last 30582    = 57913
#                                     claim       1 req  carried 34985 = 62316
#                                   23*27331 = 628613, plus the carried sums
#                                   256655                   =   885268
#   INPUT                                                       1166086
#   OUTPUT  17*t + t + 17*W + 6F
#           = 1360 + 80 + 7463 + 24000                   =        32903
#   TOTAL                                                       1198989
# minus the 4000 output budget leaves the figure below.
#
# CROSS-CHECK, the same discipline as the Analyst's: two separate moves from the
# previous 240155, each attributable on its own.
#   The five granted catalog entries, at the OLD 10-call/16-request shape:
#     the fixed prompt re-sent, 16 requests x (3871 - 1932)  = +31024
#                               240155 + 31024             = 271179.
#   NE-CS-WHOLE-LADDER's ceiling move (10 -> 17 tool calls, at S = 3871) adds
#   211197, and every token of it is one of the 7 added tool calls:
#     the 7 new tool-reading requests   sum(S + k*1380 for k in 10..16)
#                                       = 7*3871 + 1380*91  = 152677
#     7 more tool turns of history, re-paid by each of the 6
#     final-answer-stage requests       6 * 7 * 1380        =  57960
#     7 more tool_call outputs          7 * 80              =    560
#                               271179 + 211197            = 482376  exactly.
#   NE-SHAPE-ALLOWANCE-4 then adds exactly ONE MORE `answer-shape` retry, by the
#   same three terms as the Analyst's block — no grant moved and S is unchanged:
#     the added retry request itself    S + 17*1380 + 17052   = +44383
#     the claim-contract retry re-pays one more shape increment = +4200
#     one more final answer written     F                     =  +4000
#                               482376 + 52583             = 534959.
#   NE-WRAPPED-CALL-FUNDED is the same TWO moves as the Analyst's block:
#   (a) R_shape 200 -> 242, the measured correction: +42/+84/+126/+168 on the
#       four shape retries and +168 on the claim retry
#                               534959 + 588              = 535547.
#   (b) the `wrapped-call` class, 17 rounds at W + R_wrap = 786:
#       the 17 new retry requests  sum(27331 + 252 + 786n for n in 1..17)
#                                  = 17*27583 + 786*153    = 589169
#       the 4 shape + 1 claim retries re-pay the whole wrapped block
#                                  5 * 786 * 17            =  66810
#       17 wrapped replies written as output  17 * 439     =   7463
#                               535547 + 663442           = 1198989.
# No other retry constant moved and no other grant changed, which is the check
# that the ceiling was COSTED rather than the budget rounded up around it.
#
# ⚠ THE WALL CLOCK NOW BINDS FIRST, AND `max_steps` CANNOT MOVE. 41 requests at
# the measured 8.3-9.5 s/request cost 340-390 s against this agent's 230 s
# clock, so a run that wrapped every rung is stopped by the CLOCK at roughly its
# 24th-27th request. That terminal is named (`budget-exhausted`/`wall-clock`)
# and is not the one this change exists to prevent; 23 steps is the subtrahend
# of the published 180 s approval window and is not available to be raised.
# Funding the token budget to the full permitted stack is still what keeps a
# run from reporting `tokens` when the cause was the answer contract.
#
# LANE HEADROOM, AND A RECORDED UNFIXED GAP. The largest SINGLE request
# is S + 17*1380 + 34985 = 62316: the 262144-window primary lanes (224460 input
# allowance) serve it 3x over. On a 32768-window lane (27033) every ordinary
# tool-reading request still fits (the deepest, request 17, costs
# S + 16*1380 = 25951), but the FIRST-ANSWER request of a full 17-call turn
# (27331) exceeds it by 298 tokens.
#
# THAT GAP IS A REAL, UNFIXED DEFECT. It is recorded here rather than guarded,
# and the reason it is not guarded is itself load-bearing — read both halves.
#
# THE FAILURE. The sealed / no-`--gpu-vllm` bring-up declares `private-default`
# at `context_window = 32768` and configures NO SECOND LANE
# (NE-DEMO-NO-CPU-FALLBACK: these tasks FAIL rather than degrade), and this
# agent routes there. A whole-ladder turn can therefore execute its governed
# writes — `draft.email.create`, a REAL M365 draft already committed, and
# `write.external.email.send`, parked at waiting_approval — and only THEN die on
# lane exhaustion, leaving an orphan draft and an unresolved parked approval with
# no answer explaining either.
#
# WHY NO CEILING IS DERIVED FROM THE NUMBERS ABOVE, AND WHY ONE MUST NOT BE.
# EVERY figure in this derivation is in MODEL tokens (chars / 2.93). EVERY
# enforcement site is in a DIFFERENT unit: `ne.gateway.gateway`'s budget
# pre-flight and `ne.runtime.model`'s trim both use `ByteTokenEstimator`
# (`ne.contracts.tokens`: bytes / 1.5 + 8, the ADR-0012 oracle-selected default,
# overridden nowhere in live.py, the pilot compose or the chart) applied to the
# SERIALIZED request. Measured on this tree with the real renderers
# (`packages/ne-api/tests/test_agent_budget_units.py`): the five granted catalog
# entries are 5680 chars = 1939 model tokens by the arithmetic above, but 3795
# tokens to the estimator that actually enforces — and the full rendered catalog
# for those five of this agent's thirteen tools is 4098, already MORE than the
# 3871 this derivation computes for the WHOLE fixed prompt. The two units differ
# by ~1.96x.
#
# So a ceiling computed from S and the 1380 step would be wrong by roughly half
# AND wrong in the UNSAFE direction (S is the subtrahend, so understating it
# yields a ceiling that is too generous). A governed number that under-protects
# while claiming to protect is a worse exhibit than a stated known limitation —
# it is the same defect class as the false `list_max` claims corrected above.
#
# TWO THINGS ANY REAL FIX MUST DO, neither of which is a manifest field:
#   1. compute in `ByteTokenEstimator` units over the serialized request, not in
#      the model-token unit this derivation (and the Analyst's, and the Overdue
#      Credit Review's, and the Grounded Analyst's) is written in; and
#   2. bound the OUTPUT-REPAIR RETRY stack, not just the first final-answer
#      request. The retries are where the overflow actually lands and they run
#      AFTER the writes, so a first-answer-only ceiling does not prevent the
#      orphan draft at all (the carried increments are staged above and now
#      reach 34985 across 23 retries since NE-WRAPPED-CALL-FUNDED, so the
#      overflow the retry stack can reach grew with it).
# That is a live, measured, in-loop budget check in the agentic runner — a real
# feature, deliberately not built here.
#
# SCOPE OF THE EXPOSURE, so the size of the risk is not overstated: this bites
# ONLY the CPU-only sealed bring-up. The demo box runs `--gpu-vllm`, where
# `private-default` is 262144 (224460 input allowance) and serves the largest
# single request of this agent three times over, so nothing here binds there.
max_input_tokens = 1194989
# Held at 4000 for the same serving-lane reason as the Analyst.
max_output_tokens = 4000

[[agents]]
# NE-GA-RUN2 (generation 21): the agent the NE-GA-RUN1 grounding gate is
# actually SCOPED to. The gate's corpus is built ONLY from recorded
# VerifiedAnswers (the `current_answer_recorder` seam fires inside the
# `read.kg.*` verified-template handlers and nowhere else), so the ONE honest
# shape for a gated agent is one whose source-bearing grants are verified
# templates and nothing else. This agent grants EXACTLY the two dispute
# templates — no `read.knowledge.search`, no `read.knowledge.graph_path` —
# so everything it retrieves is inside what the gate can see, and a withheld
# answer means the answer genuinely asserted more than its retrieved rows
# prove, never that the agent read evidence the gate is blind to. The
# Meridian Analyst stays UNGATED for exactly the inverse reason (its chunk
# corpus never enters the gate's corpus; see
# `OntologySettings.grounded_run_agent_ids`).
# Gating itself is deployment config (`NE_ONTOLOGY_GROUNDED_RUN_AGENT_IDS`
# naming this agent_id), never a registry field — this entry is a valid
# ungated agent wherever that setting is absent, which is why the description
# below is deployment-CONDITIONAL ("where a deployment gates it"), never a
# categorical promise the registry cannot enforce. The Run gate's tier is its
# own knob (`NE_ONTOLOGY_GROUNDING_RUN_STRICTNESS`, default strict): the demo
# runs this agent STRICT while chat stays STANDARD, because this agent's whole
# retrievable corpus is gate-visible so strict's cost is honest here. The tier
# only ever moves VOCABULARY enforcement; a gated run that completed zero
# verified reads is withheld at EVERY tier by the Run path's own
# non-empty-evidence invariant (NE-GA-RUN5) — an evidence rule, not a finding
# class, so no allowlist phrasing and no tier choice can evade it.
#
# DOCUMENTED RESIDUALS (U11 review; disclosed, not discovered). What the gate
# PROVES is containment and fact-anchoring — numbers, identifiers and
# citations verified against the retrieved rows with same-sentence provenance
# anchors; every other token required to come from the rows, the question, or
# the fixed allowlist; and (NE-GA-RUN5) zero-fetch runs withheld outright.
# NE-GROUND-REL (generation 23): wrong-row pairing — formerly residual #1
# here — is now ENFORCED: a `relation-ungrounded` FACT class (withholds at
# every tier) refuses a sentence pairing one dispute's name with another
# dispute's status unless a fetched row, a named row, a same-column
# enumeration, or a gate-recomputed aggregate supports the pairing. The spec's
# bar ("no unverified fact") is the standing REQUIREMENT; the remaining
# distance stays disclosed below, never promoted to working-as-intended:
#   1. Swapped compound (open): a sentence naming BOTH rows and BOTH values
#      passes even with the pairings swapped — the bag-of-tokens fixed point
#      the numeral row-binding shares; attribution is likewise
#      sentence-scoped (cross-sentence pronoun claims are not bound).
#   2. Prompt echo (design-accepted): the gate certifies containment in
#      corpus ∪ question ∪ allowlist, so a question that embeds its own
#      answer is affirmable without matching fetched rows (the zero-fetch
#      case is now closed by NE-GA-RUN5; echo over a non-empty corpus
#      remains). Numerals stay prompt-inexempt; echo counts are stamped into
#      provenance (prompt_echo_count) rather than enforced.
#   3. Allowlist-only phrasing (by design): sentences composed entirely of
#      core-allowlisted connective vocabulary produce no findings at any
#      tier — over a NON-empty corpus such prose rides on the run's proven
#      rows without asserting a checkable fact token. The allowlist is what
#      keeps ordinary connective prose from tripping the gate; it is not
#      pruned to fake semantic coverage.
# The description below is written to promise exactly what the mechanism
# delivers and no more.
agent_id = "agt_01k3groundedanalyst000000000"
# Version 3 / generation 23 (NE-GROUND-REL, owner ruling 2026-08-29): the
# grounding gate now enforces semantic row binding (the `relation-ungrounded`
# fact class), so the DESCRIPTION is corrected again — the spec's guarantee is
# stated as the standing requirement the gate is being held to, what is now
# mechanically enforced is named, and the remaining distance is disclosed
# rather than narrowed away. No grant, budget, model policy or instruction
# changed — the definition hash moves on prose alone, and immutability
# demands the version move with it.
#
# Version 4 / generation 26 (NE-SHAPE-ALLOWANCE-4): the `answer-shape` retry
# allowance moved 3 -> 4, and this agent's token budget is DERIVED from the
# request ceiling that allowance sets, so `max_input_tokens` is re-derived below
# (131523 -> 165321). A budget left at the 5-retry figure would have made the
# funded ceiling fictional. Nothing else moved.
#
# Version 5 / generation 27 (NE-WRAPPED-CALL-FUNDED): the pool gained the
# ladder-sized `wrapped-call` class, `model_request_limit(4)` moved 11 -> 15,
# and the same DERIVED budget is re-derived again (165321 -> 226437). Nothing
# else moved.
version = 5
label = "Meridian Grounded Analyst"
description = "Answers Meridian debit-card dispute questions strictly from governed verified record reads. Where a deployment gates it, a deterministic whole-answer grounding gate holds answers to the spec bar of no unverified fact: zero-fetch runs are withheld, every number, identifier and citation must be proven against the fetched rows, and pairing fetched values in a relation no fetched row states is withheld. Disclosed gap: naming both rows and both values can pass with pairings swapped."
owner_label = "Meridian Servicing Operations"
lifecycle = "active"
allowed_strategies = ["agentic"]
default_strategy = "agentic"
# The SAME model policy and serving lane as the Analyst, deliberately (the
# Customer Support precedent): the exhibit is the gate, not a second routing
# decision, and the gateway's task map carries exactly this id.
model_policy_id = "agent.meridian-analyst.v2"
# The SAME instruction posture as the Analyst, dispute-scoped — evidence-only
# answering, honest refusal, read-only. Deliberately NOTHING beyond the
# Analyst's own standing rules: the gate is enforcement infrastructure, not a
# prompt, and an instruction set tuned to provoke (or suppress) withholds
# would stage the exhibit either way. 442 chars = 151 tokens at 2.93, re-paid
# on every one of the 10 permitted model requests (budget below).
instructions = "You are the Meridian dispute records reviewer, a read-only agent. Answer dispute questions strictly from the verified record rows your tools return during this run. Never state or imply anything the served rows do not themselves state; when the rows do not support an answer, say so plainly instead of guessing. You cannot draft, send, or modify anything: if asked to email a customer or take any other action, explain that you are read-only."
# EXACTLY the Analyst's two dispute-lane templates, REQUIRED (not optional):
# this agent is nothing without them — no chunk store, no graph walk — so a
# deployment missing the release keeps an honestly UNAVAILABLE agent rather
# than an available one with zero tools. Deliberately NOT granted:
# `read.kg.overdue_provisional_credit_disputes` (the materialised-deadline
# template) — the SAME scoping the Analyst already embodies for the S9
# exhibit: overdue-ness is a determination the served policy tiers + dates
# support making, not a row this agent reads pre-made; and deliberately no
# other `read.kg.*` template, because an over-granted agent in a governance
# demo is a worse exhibit than a refusal.
tool_grants = [
  "read.kg.disputes_directory",
  "read.kg.open_disputes_by_status",
]
knowledge_sources = [
  { source_id = "meridian-governed-local-t3", tiers = ["t3"] },
]
skills = []
availability_dependencies = [
  { kind = "tool", dependency_id = "read.kg.disputes_directory" },
  { kind = "tool", dependency_id = "read.kg.open_disputes_by_status" },
  { kind = "knowledge", dependency_id = "meridian-governed-local-t3" },
  { kind = "model-policy", dependency_id = "agent.meridian-analyst.v2" },
]

