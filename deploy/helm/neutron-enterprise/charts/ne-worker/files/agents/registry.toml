[agents.budgets]
# COUNTED for the two-call ladder this Agent runs, and DELIBERATELY SMALL.
#   1  read.knowledge.search      the governed read that serves the ONE
#                                 protected source reference the tier-2 park
#                                 binds
#   1  write.external.demo.send   the inert tier-2 call that parks
#   2  headroom for one re-read after a rejected query
#   --
#   4  max_tool_calls
#
# ⛔ max_steps IS CAPPED BY A DERIVATION ELSEWHERE, not chosen freely.
# `packages/ne-runtime/tests/test_approval_window_is_honourable.py` derives the
# deployment's honourable approval window as
# `console renew trigger (420 s) - max(max_steps) * 10 s over every agent
# holding a tier-2-or-higher grant - 10 s clock-skew leeway`, and the shipped
# declared window is 180 s. This Agent HOLDS such a grant
# (`write.external.demo.send`, tier 2 by `tiers.rego`'s `write.external.`
# prefix), so it is IN that maximum. Meridian Customer Support sits at 23, so
# 23 is the CEILING here: at 24 the subtrahend becomes 240, the ceiling drops
# to 170, the declared 180 s no longer fits, and every
# `write.external.email.send` park REFUSES. This entry is at the ceiling, NOT
# above it — the maximum is unchanged, so the published window is unchanged.
#
# ⭐ NE-INERT-BUDGET (generation 25 / version 2): 6 -> 23, BECAUSE AT 6 THIS
# AGENT COULD NOT PARK ON THIS BOX AT ALL. Six steps buys a 60.0 s enforced
# turn wall clock (`ne.api.agent_execution_caps._SECONDS_PER_STEP` = 10,
# hard-cancelled by `asyncio.timeout` around `agent.run` in
# `ne.runtime.runner`). Measured on the deployed stack, the two-call ladder
# above costs more than that before it ever reaches the park:
#
#   ~24 s   warm per-run overhead ahead of the first tool call
#   108-207 s  the ONE governed `read.knowledge.search`
#              (`ne.brain.pipeline` `rerank_ms`, n=8 over 24 h:
#              108138-207318 ms). `ne-pilot-tei-rerank-1` runs
#              `BAAI/bge-reranker-v2-m3` on 12 CPUs with NO GPU and issues two
#              rerank calls of 22-117 s each, mostly queue time.
#   --
#   ~135 s  CHEAPEST observed ladder, against a 60 s budget.
#
# Three live attempts produced ZERO parks. The read is not optional headroom:
# `middleware._run_source_references` refuses a Tier-2 park whose Run served no
# protected source reference, so the ladder cannot be shortened to fit 60 s.
#
# ⚠ 23 IS THE ONLY VALUE WITH REAL MARGIN, AND IT IS STILL NOT A GUARANTEE.
# 230 s clears the cheapest ladder by ~95 s and clears seven of the eight
# observed reads. The SLOWEST observed draw does not fit: 207.3 s of governed
# read plus ~24 s of warm overhead is ~231 s, so a tail draw is still
# hard-cancelled BEFORE the park, and the run terminalizes on the wall clock
# instead. That residual is the RERANKER's, not this budget's — it cannot be
# bought off here, because 24 is unreachable without shrinking a governed
# number. Anything below 23 trades margin away for nothing: `max_steps` only
# narrows `max_tool_calls` (`min(23, 4)` is still 4) and sets the clock, so
# this move changes the wall clock and NOTHING else — same tool ceiling, same
# token budget, same one parked write.
#
# ⚠ THE MODEL-REQUEST CEILING IS NO LONGER 'SAME': NE-WRAPPED-CALL-CLASS made
# the retry pool a function of `max_tool_calls`, so this agent's ceiling moved
# 11 -> 15. Its `max_input_tokens` is a CHOSEN 16384, not an equality pin like
# the four demo agents', so nothing forced a re-derivation and no test covers
# it — it was under-funded for its permitted worst case before this change and
# still is. It is the ops self-test (inert, no external effect), never a demo
# exhibit, which is why it is recorded here rather than re-cut in this train.
#
# ⚠ AND IT RAISES THIS AGENT'S ADMISSION FLOOR. `ne.api.run_credential_floor`
# requires `wall clock + 20 s dispatch` of credential life at admission, so a
# Run of this Agent now needs 250 s rather than 80 s. That is still under the
# deployment bound `RUN_CREDENTIAL_FLOOR_BOUND_SECONDS = 420` (the Meridian
# Analyst's 40 steps set that), so the shipped constant does not move.
max_steps = 23
