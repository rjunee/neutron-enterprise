[agents.budgets]
# NE-MULTIHOP-FANOUT. RE-SIZED for the fan-out the flagship DR-4830 question
# ACTUALLY has. At `max_tool_calls = 10` that question terminated
# `budget_exhausted`/`tool-calls` after 104.6s live (2026-08-27), and the ceiling
# was the honest stop: 10 calls cannot traverse this population, because every
# `read.kg.*` template binds exactly ONE key.
#
# THE HOP COUNT IS COUNTED, NOT ESTIMATED. From the fixture's own shape
# (`tools/meridian/fixtures/meridian-v1/ground_truth.json` b1 and the generator
# that emits it) and each template's declared args:
#    1  read.knowledge.search        the DR-4830 hardship SOP that DEFINES
#                                    "eligible for a new hardship offer" (active,
#                                    no prior hardship offer, no repossession)
#                                    and the 14-day window. The eligibility rule
#                                    is prose in t1/t2, not a graph edge, so this
#                                    is a required hop, and the live run's own
#                                    opening move.
#    1  read.kg.disaster_declarations  takes NO args and returns every designated
#                                    county in one call -> Columbia, Jefferson,
#                                    Richmond.
#    3  read.kg.customers_in_counties  `q_county` is ONE enum value (max_length
#                                    16); the template's own description reads
#                                    "call once per county for a complete bounded
#                                    sweep". 3 counties -> 11 affected customers.
#   11  read.kg.autoloans_for_customer `q_customer_id` matches
#                                    `^mer-cus-[0-9]{3}$` — one customer per call.
#                                    8 of the 11 hold an auto loan; the 3 that do
#                                    not (mer-cus-011/013/015) can only be
#                                    established BY the empty read.
#    8  read.kg.payments_due_window   `q_loan_id`, one loan per call, 8 loans.
#    8  read.kg.servicing_notes_for_loan  `q_loan_id`, one loan per call.
#   --
#   32  the complete traversal that yields the ground truth
#       {mer-loan-001, mer-loan-002, mer-loan-003}.
#    2  headroom for one or two refinements — a read re-issued after a rejected
#       county spelling, or a re-read of a result the model mis-summarised.
#   --
#   34  `max_tool_calls`.
#
# 34 is not a round number and not a guess: 32 is what this fixture's 3-county /
# 11-customer / 8-loan fan-out costs in SINGLE-KEY reads, and 2 is the refinement
# headroom that was asked for. A model that prunes — dropping `payments`/`notes`
# for loans whose OWN row already says `paid_off`/`repossession` or a
# `next_due_date` outside the window — reaches the same answer in 26. 34 is the
# budget that does not require the model to be clever.
#
# THE REAL FIX IS TEMPLATE ARITY, NOT THIS NUMBER. `customers_in_counties` is
# plural in its own name and still takes one county. Widening it,
# `autoloans_for_customer`, `payments_due_window` and `servicing_notes_for_loan`
# to a multi-row `VALUES` binding collapses 3+11+8+8 = 30 calls into 4 and the
# whole chain into 6 — inside the OLD 10-call budget, in about a minute. Until
# that lands, this budget is what buys a complete answer.
max_steps = 40
max_tool_calls = 34
# `max_steps` is NOT the tool ceiling and never was: `enforced_agentic_caps`
# makes the tool ceiling `min(max_steps, max_tool_calls)` and the wall clock
# `max_steps * 10`. Nothing enforces a relation between `max_steps` and the
# request ceiling; 40 is held at 40 so that
#   (a) `max_tool_calls = 34` is the BINDING tool ceiling, named by the field
#       whose name says so, and
#   (b) the run gets about ten seconds of wall clock per model request it is
#       PERMITTED to make, which is the measured rate: 49.9s for 6 requests
#       (8.3s each) and 104.6s for 11 requests (9.5s each).
# `wall_clock_seconds` therefore becomes 400.
#
# ⚠ `max_steps` IS NO LONGER ANYWHERE NEAR `model_request_limit(34)`, AND THAT
# IS NOW A STANDING PROPERTY RATHER THAN A ONE-OFF RESIDUAL. NE-SHAPE-ALLOWANCE-4
# first broke the old equality (40 vs 41); NE-WRAPPED-CALL-FUNDED makes the
# request ceiling `2*max_tool_calls + 7` = 75, because the `wrapped-call`
# allowance is one corrective round per rung of the ladder. So the wall clock
# funds 40 of the 75 requests this run may make, and at the measured 8.3-9.5
# s/request 75 requests cost 622-712 s against a 400 s clock.
#
# STATED PLAINLY RATHER THAN PAPERED OVER: a run that actually wrapped every
# rung would be stopped by the CLOCK at roughly its 42nd-48th request, not by
# the request ceiling and not by the token budget. That is still a NAMED
# terminal (`budget-exhausted`/`wall-clock`) and it is not the failure this
# change exists to prevent, which is `budget_exhausted`/`tokens` — a terminal
# that names the wrong cause and is reached BEFORE the correction is delivered.
# The token budget below funds the whole permitted stack so that the cause a
# run reports is the cause it actually hit.
#
# `max_steps` is held at 40 for the reason it has always been held: the same
# equality CANNOT be restored on Meridian Customer Support — its `max_steps` is
# the subtrahend of this deployment's published 180 s approval window and 23 is
# a hard ceiling there (see that agent's block). Moving this one alone would buy
# clock at the price of two agents obeying different rules.
#
# THE TRADEOFF IS STATED, NOT HIDDEN. A complete unpruned run is 34 tool calls
# and 35+ model requests, and the later requests are the expensive ones
# (request 35 carries 49463 input tokens against the old final request's 16343).
# Expect four to six and a half minutes for the full traversal. That is a SLOW
# demo, and it is worse than the 90s one the room wants. It is still strictly
# better than the 104.6s `budget_exhausted` it replaces, which produced no answer
# at all. The template-arity fix above is what gets the minute back; inflating
# this clock further would not.
#
# `max_input_tokens + max_output_tokens` IS the run's cumulative
# `total_tokens_limit` (ne.api.platform._compose_workflow_execution_bindings), and
# pydantic-ai counts that ACROSS every request in the loop, not per request. So
# the token budget has to be RE-DERIVED whenever the request ceiling moves, or it
# binds first and makes the call ceilings fictional — which is exactly how this
# Agent failed at 24000+4000.
#
# RE-DERIVED for 34 tool calls / 41 model requests by the SAME method as the two
# derivations before it (NE-TOKEN-BUDGET-14, NE-CLAIM-RETRY-RESERVE), with the
# SAME constants.
#
# NE-CS-SPLIT re-measures S DOWN (3132 -> 2916): revoking `draft.email.create`
# and `read.skills.view` removes their two catalog entry lines (231 + 202 chars,
# measured over the composed ToolSpecs by the same renderer), and un-pinning the
# Skill removes the one-line Skill index (201 chars — `render_index` returns the
# EMPTY STRING for zero packs, never a bare header). 634 chars / 2.93 = 216
# tokens, re-paid on all 40 requests below = 8640 off the previous ceiling.
# Prompt text is a budget input exactly as a grant is — in BOTH directions.
#
# NE-ANALYST-INSTRUCTIONS (generation 17) then re-measures S UP (2916 -> 3090):
# the manifest `instructions` above are the agent's own system prompt, sent
# ahead of the (empty) Skill index on every request. 508 chars (len() of the
# exact TOML string; the worker composes it verbatim — with zero pins there is
# no index and no joiner) / 2.93 = 174 tokens, re-paid on all 40 requests below
# = 6960 onto the previous ceiling.
#   S  = 3358  fixed prompt re-sent every request: the manifest instructions
#              (508 chars = 174 tokens, NE-ANALYST-INSTRUCTIONS), plus the
#              3184 itemised by the derivations above: the in-band tool catalog
#              (rendered by ne.runtime.model._catalog_text, which carries each
#              tool's description AND its args JSON Schema), the PromptedOutput
#              schema block for _StructuredAgenticCompletion, the answer-transport
#              tail, NO Skill index (empty at zero pins) and the question
#              (~150 chars), at ~2.93 chars/token. Measured for the
#              verified-answer lane's 11 grants in NE-ANALYST-VERIFIED-LANE
#              (S = 2543), re-measured to 3132 by NE-LANE-CHOICE (its
#              itemisation kept below), reduced 216 by NE-CS-SPLIT as itemised
#              above, then raised 209 by NE-ANSWER-THE-QUESTION (generation 18
#              / version 14), measured over the exact inserted strings: the
#              enumeration-question rule in the answer-transport tail (+336
#              chars), the open-disputes catalog entry now naming the
#              deadline/notice/as-of columns each row serves (+263), and
#              "debit-card (Reg E)" in the directory entry (+13) —
#              612 / 2.93 = 209 tokens — and raised a further 59 by
#              NE-GRAPH-ANCHOR (same generation): the shared
#              read.knowledge.graph_path catalog entry grew 174 chars (id/class
#              endpoint semantics in its description and both arg schemas,
#              measured over the rendered _catalog_text line) = 59 tokens at
#              2.93. So the catalog-and-tail component is 2916 + 209 + 59 =
#              3184, and with the manifest instructions S = 3358, re-paid on
#              all 40 requests below. The NE-LANE-CHOICE count, kept for the
#              record:
#                each of the 7 read.kg entries carries CATALOG_SHAPE_CLAUSE,
#                +87 bytes                                           +609
#                read.knowledge.search now says what it RETURNS instead
#                of naming the store it reads                        +116
#                the ONE template declaring [date_window] publishes its
#                endpoint semantics in its two date args' schema       +350
#                the answer-transport tail gained the rows-are-not-
#                quotable rule, which carries the row form and the
#                no-derived-totals rule with it: 1519 -> 2167 chars   +648
#                                                          = 1723 chars
#              1723 / 2.93 = 589 tokens, so S 2543 -> 3132. RE-MEASURED against
#              train-32: NE-SPAN-BIND replaced the claims contract with a
#              server-selected span and rewrote the tail, so the tail figure is
#              taken from THAT tail, not the one this guidance was first written
#              against.
#   C  = 1300  one search result: `retrieval_top_k = 5` (ApiSettings) x a live
#              corpus chunk MEASURED at 700.8 chars = 239 tokens via TEI
#              /tokenize (20 real `ne_chunks` rows, 2026-08-27), plus the
#              `<chunk_id>: ` prefix each chunk carries into the rendering.
#   t  =   80  the assistant's one-line tool_call JSON incl. `step_intent`.
#   F  = 4000  the final answer, at this Agent's own `max_output_tokens`.
#   W  =  439  NE-WRAPPED-CALL-FUNDED. A PROSE-WRAPPED TOOL CALL — prose around
#              exactly one well-formed call — re-paid in history and written as
#              output. MEASURED, on the only two live instances there are: the
#              S5 governed-send rejections stamped `chars=1134` and `chars=1284`
#              by `rejected_reply_shape`, i.e. the whole stripped reply. The
#              LARGER of the two, 1284 / 2.93 = 439. ⚠ THIS IS AN OBSERVED
#              FLOOR, NOT A PROVEN CEILING, exactly as the `answer-shape`
#              allowance of 4 is: nothing stops a model wrapping a call in more
#              prose, and the hard bound is `max_output_tokens` = F = 4000. It
#              is recorded as the measured figure rather than padded to F
#              because padding it costs this Agent ~2.85M tokens of budget for
#              a shape no run has ever produced. At F the derivation below
#              totals 6511876 and the worst single request 219699 — still
#              inside a 262144-window lane, but with 4761 tokens to spare.
#   R_res   = 172  `_RESIDUE_RETRY`, measured (503 chars / 2.93). A server-
#              authored `ModelRetry` string, so `_render_retry_prompt` delivers
#              it verbatim: the whole message.
#   R_wrap  = 347  the WHOLE rendered wrapped-call retry, measured through
#              `GatewayModel._render_retry_prompt` on this tree: pydantic-ai's
#              `model_response()` for the single `json_invalid` root entry
#              (240 chars — no `input` echo, see that method's field table)
#              + the two joining newlines + `_WRAPPED_CALL_RETRY` (774 chars)
#              = 1016 chars / 2.93.
#   R_shape = 242  ⭐ CORRECTED from 200 by NE-WRAPPED-CALL-FUNDED, and the
#              correction is a MEASUREMENT, not a re-estimate. 200 described
#              "pydantic-ai's own JSON error list" ALONE, which stopped being
#              the whole retry message when NE-RETRY-LEGIBLE began appending
#              `final_answer_retry_instruction` to it. Measured the same way as
#              R_wrap beside it: 240 + 2 + `_STRUCTURED_ANSWER_RETRY_CORRECTION`
#              (467 chars) = 709 chars / 2.93 = 242. R_res and R_claim were
#              already whole-message figures, so this makes all four constants
#              share ONE basis — which is the only way R_wrap is comparable to
#              the constant beside it. Costs +588 on every derivation below.
#   R_claim = 403  the LARGEST message the reserved claim slot can carry —
#              `max(len(_claim_correction(r)) for r in _CLAIM_REJECTION_REASONS)`
#              = 1179 chars / 2.93. It is no longer `_CLAIMS_REQUIRED_RETRY`,
#              which NE-SPAN-BIND deleted along with the claims contract. MOST OF
#              THIS DRIFT PREDATES this change: at train-32 the worst correction
#              was already 1048 chars (358 tokens) against a figure here still
#              reading 327, so 31 of the 76-token move is this change's (the
#              rows hint added to the unbound-span correction) and 45 was already
#              owed. Corrected rather than left understating the slot, because a
#              budget derived from a retry message smaller than the one actually
