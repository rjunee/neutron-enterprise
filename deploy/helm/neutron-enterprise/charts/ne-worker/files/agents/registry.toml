[[agents]]
# Version 16 / generation 27 (NE-WRAPPED-CALL-FUNDED): the output-retry pool
# gained the ladder-sized `wrapped-call` class, so `model_request_limit(34)`
# moved 41 -> 75 and this budget — which is DERIVED from that ceiling — is
# re-derived below (1327813 -> 3662637). Nothing else about the definition
# moved: no grant, no instruction, no `max_steps`, no `max_tool_calls`.
agent_id = "agt_01k3meridiananalyst000000000"
version = 16
label = "Meridian Analyst"
description = "Answers Meridian servicing questions with governed knowledge and graph evidence. Read-only: drafting and outreach live on Meridian Customer Support."
owner_label = "Meridian Servicing Operations"
lifecycle = "active"
allowed_strategies = ["agentic"]
default_strategy = "agentic"
# NE-ANALYST-INSTRUCTIONS (generation 17 / version 13). The Agent's own system
# prompt, which it should always have had: until NE-CS-SPLIT its runtime
# instructions were INCIDENTALLY non-empty only because the pinned Skill's
# rendered index was standing in for them, and removing the last pin composed an
# empty prompt that the runtime's non-empty-instructions guard refused —
# killing every run at run time. The manifest now REQUIRES instructions for an
# agentic agent with no Skill pins, so this misconfiguration fails at registry
# load, legibly, not after admission.
# The text is deliberately SHORT: it is re-sent on every one of the run's 40
# permitted model requests (see the budget derivation below — 508 chars = 174
# tokens x 40 requests), and it carries ONLY what the model cannot infer from
# its tool schemas: governed-evidence-only answering, no assertions beyond the
# served records, and the honest read-only refusal (demo beat S7). The
# answer-transport rules already ride in on the completion tail; repeating them
# here would be paid 40 times for nothing.
instructions = "You are the Meridian servicing analyst, a read-only agent. Answer servicing questions strictly from the governed evidence your tools return during this run. Never state or imply anything the served records do not themselves state; when the records do not support an answer, say so plainly instead of guessing. You cannot draft, send, or modify anything: if asked to email a customer or take any other action, explain that you are read-only and that outreach is handled by the Meridian Customer Support agent."
model_policy_id = "agent.meridian-analyst.v2"
# NE-ANALYST-VERIFIED-LANE. The six `read.kg.*` grants are the verified-answer
# templates the four demo questions ACTUALLY read, one per question-step, and
# nothing else. Meridian Hardship Review already grants four of them for the
# same corpus; this is the agentic agent reaching the same governed lane.
#   B1 "for DR-4830, which affected loans ... eligible for a hardship offer?"
#      -> customers_in_counties, autoloans_for_customer, payments_due_window,
#         servicing_notes_for_loan (+ disaster_declarations, optional below)
#   B2 "which open debit-card disputes are overdue for provisional credit?"
#      -> disputes_directory, open_disputes_by_status
#   B3 "total value of Reg E provisional credits issued late?" (a REFUSAL) and
#      its control question -> disputes_directory
# Deliberately NOT granted, though they exist in other fixtures' registries:
# `read.kg.entity_by_iri`, `read.kg.accounts_directory`,
# `read.kg.tickets_by_status`, `read.kg.orders_*`, `read.kg.unpaid_invoices`,
# `read.kg.boot_directory`. No demo question reads them, and an over-granted
# agent in a governance demo is a worse exhibit than a refusal.
#
# Generation 18 / version 14 is NE-ANSWER-THE-QUESTION + NE-GRAPH-ANCHOR: no
# grant moves; the answer-transport tail gained the enumeration-question rule,
# the two dispute catalog entries name what their rows serve, and the shared
# read.knowledge.graph_path catalog entry grew (id/class endpoint semantics), so
# S and the token budget are re-derived below — prompt text is a budget input.
# NE-CS-SPLIT (generation 16 / version 12, owner decision 2026-08-27): the
# Analyst is ANALYTICAL AND READ-ONLY. `draft.email.create`, the
# `meridian-hardship-draft` Skill pin, and `read.skills.view` (which, with no
# Skill pinned, could only ever fail closed) all moved to the new Meridian
# Customer Support agent below. Asked to email a customer, this agent has no
# tool that could and must SAY so — an honest capability refusal is the intended
# exhibit, and the DR-4830 eligibility rules it needs remain fully served
# through `read.knowledge.search` (the Disaster Hardship Response SOP,
# art-hardship-2026, states them verbatim in the t1/t2 corpus).
tool_grants = [
  "read.knowledge.search",
  "read.knowledge.graph_path",
  "read.kg.customers_in_counties",
  "read.kg.autoloans_for_customer",
  "read.kg.payments_due_window",
  "read.kg.servicing_notes_for_loan",
  "read.kg.disputes_directory",
  "read.kg.open_disputes_by_status",
  "read.kg.disaster_declarations",
]
# The WHOLE verified-answer lane is OPTIONAL, tools and Tier-3 release alike,
# and that is deliberate on two counts.
#   1. It keeps the boot story this catalog already tells: knowledge arrives
#      progressively, and the Analyst is admitted as soon as `meridian-servicing`
#      t1 lands rather than waiting on a Tier-3 publish. A REQUIRED grant would
#      make the agent UNAVAILABLE wherever the release is absent — strictly worse
#      than an agent that answers what it can and refuses the rest.
#   2. `read.kg.disaster_declarations` ships on a separate branch
#      (NE-MERIDIAN-DISASTER, d691f600). Optional is the whole of this file's
#      dependency on it: where that template is registered the Analyst reads
#      DR-4830's own designated counties instead of being told them; where it is
#      not, nothing here breaks.
# `effective_agent_tool_grants` admits the optional tools only once the optional
# knowledge is ready, so the lane is admitted as ONE unit — never a read.kg tool
# without the release it reads.
optional_tool_grants = [
  "read.knowledge.graph_path",
  "read.kg.customers_in_counties",
  "read.kg.autoloans_for_customer",
  "read.kg.payments_due_window",
  "read.kg.servicing_notes_for_loan",
  "read.kg.disputes_directory",
  "read.kg.open_disputes_by_status",
  "read.kg.disaster_declarations",
]
# Tier 3 is the Oxigraph RDF release the `read.kg.*` tools read; it serves NO
# chunk-store corpus, so it contributes nothing to a `read.knowledge.search`
# filter and cannot widen one (`ne.api.knowledge_scope`:
# KNOWLEDGE_SOURCE_CONNECTORS maps it to an EMPTY tuple, and a scope naming only
# it is refused rather than silently widened).
knowledge_sources = [
  { source_id = "meridian-servicing", tiers = ["t1", "t2"] },
  { source_id = "meridian-governed-local-t3", tiers = ["t3"] },
]
optional_knowledge_sources = [
  { source_id = "meridian-servicing", tiers = ["t2"] },
  { source_id = "meridian-governed-local-t3", tiers = ["t3"] },
]
# NE-CS-SPLIT: no Skill pin — the hardship-draft procedure belongs to Meridian
