#
# Dev OTel Collector config: accept OTLP over gRPC and HTTP, batch, and print
# to the collector's own log output (`debug` exporter) so traces/metrics/logs
# are visible with `docker compose logs otel-collector`. No external backend
# is configured in dev — swap the exporter for a real backend as needed.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
