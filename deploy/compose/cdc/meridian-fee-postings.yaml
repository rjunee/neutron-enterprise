# BD-12a — synthetic Meridian fee-postings source for the demo-only CDC profile.
# Layer this file AFTER compose.yaml and activate `meridian-fee-postings`.
# The ordinary `cdc` profile and every pilot/default profile remain unchanged.

services:
  debezium:
    environment:
      # Bind to the one pre-created least-privilege publication. Debezium may not
      # broaden capture by auto-creating a publication over sibling tables.
      DEBEZIUM_SOURCE_PUBLICATION_NAME: meridian_fee_postings
      DEBEZIUM_SOURCE_SLOT_NAME: meridian_fee_postings
      DEBEZIUM_SOURCE_PUBLICATION_AUTOCREATE_MODE: disabled
    depends_on:
      meridian-fee-db:
        condition: service_healthy

  meridian-fee-db:
    # The chart/Zarf-accepted PostgreSQL 18.6 pin (deploy/helm/neutron-enterprise/
    # values.yaml). This is a synthetic source-system container, not a replacement
    # for the platform Postgres.
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: ["meridian-fee-postings"]
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
    environment:
      POSTGRES_USER: meridian_owner
      POSTGRES_PASSWORD: ${NE_CDC_DEMO_DB_ADMIN_PASSWORD:?set by the operator}
      POSTGRES_DB: meridian
      # Consumed only by the init script to create the narrower replication role.
      NE_CDC_SOURCE_DB_PASSWORD: ${NE_CDC_SOURCE_DB_PASSWORD:?set by the operator}
    volumes:
      - meridian-fee-db-data:/var/lib/postgresql
      - ./meridian-fee-postings-init.sh:/docker-entrypoint-initdb.d/10-meridian-fees.sh:ro
      - ./meridian-fee-postings.sql:/opt/neutron/meridian-fee-postings.sql:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian_owner -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  meridian-fee-db-data:
