#
# ne-serve — vLLM OpenAI-compatible serving profile for the private-vllm lane
# (SPEC §3.1/§3.3/§5 NE-013). ADDITIVE and profile-gated: this is a SEPARATE
# compose file from deploy/compose/dev/compose.yaml (which is frozen by
# tools/ne-cli/tests/test_dev_stack.py) — the GPU/CPU serving services live
# ONLY here and never touch the base dev stack.
#
# ADOPT-VIA-ISOLATION (SPEC §11): vLLM is an EXTERNAL container, never a
# platform Python dep (vllm->torch->NVIDIA CUDA wheels can never classify FREE
# under C4). Serve IN-VPC ONLY — never expose these ports publicly; the gateway
# private-vllm lane + SSRF validator (NE-012) are the sanctioned consumers.
#
# Image provenance (tag@digest, licenses, CVE/KEV notes, verification date) is
# recorded in deploy/compose/serve/README.md — do not bump an image here
# without updating that table AND the pinned digests in
# packages/ne-serve/tests/test_compose_serve_profile.py.
#
# Air-gap (C2): pre-stage weights first —
#   python -m ne.serve download Qwen/Qwen3-0.6B --dest ./models
# then bring a profile up; HF_HUB_OFFLINE=1 => zero runtime egress.

name: ne-serve

services:
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:v0.24.0@sha256:251eba5cc7c12fed0b75da22a9240e582b1c9e39f6fbc064f86781b963bd814f
    command:
      - "--model"
      - "/models/${NE_VLLM_MODEL_DIR:-Qwen/Qwen3.6-35B-A3B}"
      - "--served-model-name"
      - "${NE_VLLM_SERVED_NAME:-qwen3.6-35b-a3b}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--structured-outputs-config.backend"
      - "xgrammar"
    environment:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      NE_VLLM_HEALTH_MODEL: "${NE_VLLM_SERVED_NAME:-qwen3.6-35b-a3b}"
    ports:
      # Loopback by default — never publish on all interfaces. Set
      # NE_VLLM_BIND_ADDR to a private/VPC interface address to serve the
      # gateway's private-vllm lane across a private network.
      - "${NE_VLLM_BIND_ADDR:-127.0.0.1}:8090:8000"
    volumes:
      - "${NE_VLLM_WEIGHTS_ROOT:-./models}:/models:ro"
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    healthcheck:
      # /health only proves that vLLM's API front process answers; it stays green
      # while the engine is unable to complete a turn. Require one deterministic
      # generated token instead. Cache a successful probe for 60s so the health
      # check does not continuously consume inference capacity.
      test:
        - "CMD"
        - "python3"
        - "-c"
        - |
          import json, os, pathlib, time, urllib.request
          marker = pathlib.Path("/tmp/ne-vllm-completion-ready")
          if marker.exists() and time.time() - marker.stat().st_mtime < 60:
              raise SystemExit(0)
          payload = json.dumps({"model": os.environ["NE_VLLM_HEALTH_MODEL"], "prompt": "Reply with one token.", "max_tokens": 1, "temperature": 0, "ignore_eos": True}).encode()
          request = urllib.request.Request("http://127.0.0.1:8000/v1/completions", data=payload, headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=90) as response:
              body = json.load(response)
              ok = response.status == 200 and len(body.get("choices", ())) == 1 and body.get("usage", {}).get("completion_tokens") == 1
          if not ok:
              raise SystemExit(1)
          marker.touch()
      interval: 30s
      timeout: 100s
      retries: 3
      start_period: 120s

  vllm-cpu:
    profiles: ["cpu"]
    image: vllm/vllm-openai-cpu:v0.24.0@sha256:b0e6f8604413a8bfcca8836bb4b57b47f1aa653957e07f8903ece531309981a1
    command:
      - "--model"
      - "/models/${NE_VLLM_CPU_MODEL_DIR:-Qwen/Qwen3-0.6B}"
      - "--served-model-name"
      - "qwen3-0.6b"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--structured-outputs-config.backend"
      - "xgrammar"
      # Qwen3-0.6B emits its hybrid-thinking trace inside message.content when
      # the CPU lane runs without a reasoning parser.  That transport residue
      # precedes prompted JSON and makes otherwise valid structured completions
      # fail closed.  The CPU fallback is a bounded demo/CI lane, so disable
      # thinking in its server-side chat-template default; callers cannot forget
      # the setting and the GPU reasoning lane remains unchanged.
      - "--default-chat-template-kwargs"
      - '{"enable_thinking":false}'
    environment:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      VLLM_CPU_KVCACHE_SPACE: "4"
      NE_VLLM_HEALTH_MODEL: "qwen3-0.6b"
    ports:
      # Loopback by default (see NE_VLLM_BIND_ADDR note on the gpu service).
      - "${NE_VLLM_BIND_ADDR:-127.0.0.1}:8091:8000"
    volumes:
      - "${NE_VLLM_WEIGHTS_ROOT:-./models}:/models:ro"
    shm_size: "16gb"
    healthcheck:
      # Match the GPU service: a front-process /health response is insufficient.
      # One token proves the engine can complete a bounded request; the marker
      # limits this resource check to at most once per minute.
      test:
        - "CMD"
        - "python3"
        - "-c"
        - |
          import json, os, pathlib, time, urllib.request
          marker = pathlib.Path("/tmp/ne-vllm-completion-ready")
          if marker.exists() and time.time() - marker.stat().st_mtime < 60:
              raise SystemExit(0)
          payload = json.dumps({"model": os.environ["NE_VLLM_HEALTH_MODEL"], "prompt": "Reply with one token.", "max_tokens": 1, "temperature": 0, "ignore_eos": True}).encode()
          request = urllib.request.Request("http://127.0.0.1:8000/v1/completions", data=payload, headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=90) as response:
              body = json.load(response)
              ok = response.status == 200 and len(body.get("choices", ())) == 1 and body.get("usage", {}).get("completion_tokens") == 1
          if not ok:
              raise SystemExit(1)
          marker.touch()
      interval: 30s
      timeout: 100s
      retries: 3
      start_period: 120s
