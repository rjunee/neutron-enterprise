template_id = "customers-in-counties"
version = 1
description = "Meridian customers in one or more validated pilot counties. q_county accepts a single county OR a list of up to 4 distinct counties, so a complete bounded sweep of the whole selected county set is ONE call; rows carry their own county."
max_rows = 100
sparql = """
SELECT ?customer ?customer_id ?county WHERE {
  #BINDINGS#
  ?customer a <https://neutron.enterprise/schema/meridian/Customer> .
  ?customer <https://neutron.enterprise/schema/meridian/customer_id> ?customer_id .
  ?customer <https://neutron.enterprise/schema/meridian/county> ?county .
  FILTER(?county = ?q_county)
}
"""

[args.q_county]
description = "Pilot county name; only the four declared counties are valid. Pass one county, or a JSON array of up to 4 distinct counties to sweep the whole pilot set in one call."
type = "str"
enum = ["Columbia", "Jefferson", "McDuffie", "Richmond"]
max_length = 16
# Cardinality cap == the whole closed vocabulary: a county list can never hold more
# distinct values than the enum declares, so the cap is exact rather than arbitrary.
list_max = 4
key_column = "county"

[scope]
graph_classes = ["bank.customer.read"]
result_shape = "enumerable"

[answer]
columns = ["customer", "customer_id", "county"]
citation_var = "customer"
contributor_vars = ["customer"]
source_status = "source_bearing"
count_total_rows = true
