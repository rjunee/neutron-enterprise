template_id = "servicing-notes-for-loan"
version = 1
description = "Every Meridian servicing note attributed to one or more validated auto-loan identifiers. q_loan_id accepts a single loan id OR a list of up to 16 distinct ids; rows carry loan_id, and a requested loan with no servicing note is reported as an empty member."
max_rows = 50
sparql = """
SELECT ?note ?note_id ?loan_id ?customer_id ?note_type ?created_date ?text WHERE {
  #BINDINGS#
  ?note a <https://neutron.enterprise/schema/meridian/ServicingNote> .
  ?note <https://neutron.enterprise/schema/meridian/note_id> ?note_id .
  ?note <https://neutron.enterprise/schema/meridian/loan_id> ?loan_id .
  ?note <https://neutron.enterprise/schema/meridian/customer_id> ?customer_id .
  ?note <https://neutron.enterprise/schema/meridian/note_type> ?note_type .
  ?note <https://neutron.enterprise/schema/meridian/created_date> ?created_date .
  ?note <https://neutron.enterprise/schema/meridian/text> ?text .
  FILTER(?loan_id = ?q_loan_id)
}
"""

[args.q_loan_id]
description = "Meridian auto-loan identifier, format mer-loan-NNN (e.g. mer-loan-007). Pass one id, or a JSON array of up to 16 distinct ids; a loan with no servicing note is reported back as an empty member, never dropped."
type = "str"
pattern = "^mer-loan-[0-9]{3}$"
max_length = 12
# 16 = the meridian-v1 auto-loan population (10) with ~1.6x headroom.
list_max = 16
key_column = "loan_id"

[scope]
graph_classes = ["bank.servicing.read"]
result_shape = "enumerable"

[answer]
columns = ["note", "note_id", "loan_id", "customer_id", "note_type", "created_date", "text"]
citation_var = "note"
contributor_vars = ["note"]
source_status = "source_bearing"
count_total_rows = true
