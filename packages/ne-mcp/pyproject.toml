[project]
name = "ne-mcp"
version = "0.1.0"
description = "MCP adapter layer: server and client."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ne-contracts",
    "ne-runtime",
    "ne-govern",
    "ne-net",
    # NE-LG-DROPIN workspace edges (zero new third-party lock names):
    #  * ne-envbuild — the shared sidecar-venv builder (ensure_sidecar_venv) that
    #    langgraph_demo.py uses to build the isolated .langgraph-venv; its sole
    #    third-party dep is filelock, already in the lock via ne-brain/ne-govern.
    #  * ne-audit — the durable audit sink/engine/schema (PostgresAuditSink,
    #    create_engine_with_timeouts, ensure_audit_schema) the demo composition
    #    root needs for the C10 chain + receipts; already in the lock via
    #    ne-runtime. No import-linter contract forbids ne.mcp -> ne.audit.
    "ne-envbuild",
    "ne-audit",
    "mcp>=1.30.0,<2",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ne.mcp"
namespace = true

[tool.uv.sources]
ne-contracts = { workspace = true }
ne-runtime = { workspace = true }
ne-govern = { workspace = true }
ne-net = { workspace = true }
ne-envbuild = { workspace = true }
ne-audit = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.28.1,<1"]
