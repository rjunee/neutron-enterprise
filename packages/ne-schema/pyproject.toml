[project]
name = "ne-schema"
version = "0.1.0"
description = "LinkML schemas (source of truth) plus codegen."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ne-envbuild",
    "ne-net",
    "pydantic>=2.13.4,<3",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ne.schema"
namespace = true

[tool.uv.sources]
ne-envbuild = { workspace = true }
ne-net = { workspace = true }
