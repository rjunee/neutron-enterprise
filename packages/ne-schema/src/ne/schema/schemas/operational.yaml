id: https://neutron.enterprise/schema/operational
name: neutron-operational
title: Neutron Enterprise Operational Schema
description: >-
  Operational domain schema for the Neutron Enterprise brain. This single
  LinkML source is the tier-upgrade mechanism (SPEC §3.1): at Tier 1 it generates
  Pydantic models and JSON Schema; the same source later generates typed entity
  contracts (Tier 2) and SHACL/OWL (Tier 3). It models the core operational
  entities an enterprise brain ingests, including the additive Meridian banking
  path Customer, AutoLoan, PaymentSchedule, and ServicingNote. Relations are
  expressed as identifier
  references (inlined: false), so the Tier-1 Pydantic fields are string id links;
  richer cross-field integrity rules (e.g. resolved_at only when a Ticket is
  closed) are deliberately deferred to SHACL at Tier 3.
version: 1.1.0
license: Apache-2.0

prefixes:
  neop: https://neutron.enterprise/schema/operational/
  linkml: https://w3id.org/linkml/
default_prefix: neop
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------------------
# Shared slots (reused across entities via the OperationalEntity mixin base).
# ---------------------------------------------------------------------------
slots:
  id:
    description: Platform-canonical entity id (stable, unique within the platform).
    identifier: true
    required: true
    range: string
  source_system:
    description: >-
      Name of the upstream system of record this entity was ingested from
      (e.g. "salesforce", "zendesk", "netsuite").
    range: string
  source_record_id:
    description: The entity's native primary key in its source system.
    range: string
  created_at:
    description: Timestamp the entity was first created in its source system.
    range: datetime
  updated_at:
    description: Timestamp the entity was last modified in its source system.
    range: datetime

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
classes:
  OperationalEntity:
    abstract: true
    description: >-
      Abstract base for every operational entity. Carries the platform-canonical
      identity and source-provenance slots shared by all records.
    slots:
      - id
      - source_system
      - source_record_id
      - created_at
      - updated_at

  Account:
    is_a: OperationalEntity
    description: >-
      An organization the enterprise does business with — a customer, prospect,
      or partner company. The anchor entity most other records associate to.
    attributes:
      name:
        description: Human-readable account (company) name.
        required: true
        range: string
      domain:
        description: Primary web domain for the account (lowercased, e.g. "acme.com").
        range: string
        pattern: ^[a-z0-9.-]+\.[a-z]{2,}$
      industry:
        description: Industry or vertical the account operates in.
        range: string
      status:
        description: Lifecycle status of the account relationship.
        range: AccountStatus
      employee_count:
        description: Approximate number of employees at the account.
        range: integer
        minimum_value: 0

  Person:
    is_a: OperationalEntity
    description: >-
      An individual — a contact, employee, or user — typically associated with
      an Account. People author Documents and are the requesters/assignees of
      Tickets and the placers of Orders.
    attributes:
      given_name:
        description: The person's given (first) name.
        required: true
        range: string
      family_name:
        description: The person's family (last) name.
        required: true
        range: string
      email:
        description: The person's primary email address.
        required: true
        range: string
        pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
      title:
        description: The person's job title or role.
        range: string
      phone:
        description: The person's contact phone number (free-form).
        range: string
      works_at:
        description: >-
          Reference (by id) to the Account this person works at. Tier-1 id link;
          becomes a typed relation at Tier 2.
        range: Account
        inlined: false
      is_active:
        description: Whether the person is currently active (not disabled/departed).
        range: boolean

  Document:
    is_a: OperationalEntity
    description: >-
      A piece of enterprise content — a contract, invoice, report, policy, or
      other file — authored by a Person, owned by a Person, and about one or
      more Accounts.
    attributes:
      title:
        description: Human-readable document title.
        required: true
        range: string
      doc_type:
        description: The kind of document this is.
        required: true
        range: DocumentType
      uri:
        description: Location of the document's content (object-store or external URI).
        range: string
      mime_type:
        description: IANA media type of the document content (e.g. "application/pdf").
        range: string
      author:
        description: Reference (by id) to the Person who authored the document.
        range: Person
        inlined: false
      owned_by:
        description: Reference (by id) to the Person who owns/is accountable for the document.
        range: Person
        inlined: false
      about:
        description: >-
          References (by id) to the Accounts this document concerns. A document
          may pertain to multiple accounts.
        range: Account
        multivalued: true
        inlined: false

  Ticket:
    is_a: OperationalEntity
    description: >-
      A support or service request belonging to an Account, raised by a
      requester Person and worked by an assignee Person.
    attributes:
      subject:
        description: Short summary line of the ticket.
        required: true
        range: string
      description:
        description: Full free-text description of the issue or request.
        range: string
      status:
        description: Workflow status of the ticket.
        required: true
        range: TicketStatus
      priority:
        description: Priority level assigned to the ticket.
        range: TicketPriority
      belongs_to:
        description: Reference (by id) to the Account this ticket belongs to.
        required: true
        range: Account
        inlined: false
      requester:
        description: Reference (by id) to the Person who requested/opened the ticket.
        range: Person
        inlined: false
      assignee:
        description: Reference (by id) to the Person assigned to work the ticket.
        range: Person
        inlined: false
      opened_at:
        description: Timestamp the ticket was opened.
        required: true
        range: datetime
      resolved_at:
        description: >-
          Timestamp the ticket was resolved, if it has been. (Cross-field
          integrity with status — e.g. present only when closed — is a Tier-3
          SHACL rule, not enforced here.)
        range: datetime

  Order:
    is_a: OperationalEntity
    description: >-
      A commercial order placed against an Account by a Person, with a monetary
      total and currency.
    attributes:
      order_number:
        description: Human-readable order number (e.g. "ORD-0001").
        required: true
        range: string
        pattern: ^ORD-[0-9]{4,}$
      account:
        description: Reference (by id) to the Account the order is placed against.
        required: true
        range: Account
        inlined: false
      placed_by:
        description: Reference (by id) to the Person who placed the order.
        required: true
        range: Person
        inlined: false
      status:
        description: Fulfillment status of the order.
        required: true
        range: OrderStatus
      currency:
        description: ISO 4217 three-letter currency code (e.g. "USD").
        required: true
        range: string
        pattern: ^[A-Z]{3}$
      total_amount:
        description: Total monetary amount of the order in the given currency.
        required: true
        range: decimal
        minimum_value: 0
      placed_at:
        description: Timestamp the order was placed.
        required: true
        range: datetime

  Customer:
    is_a: OperationalEntity
    description: >-
      A Meridian retail-banking customer. The bounded Tier-2 projection carries
      the stable corpus identifier, human name, county, and lifecycle status
      needed to anchor the governed disaster-hardship graph path.
    attributes:
      customer_identifier:
        description: Stable Meridian customer identifier.
        required: true
        range: string
        pattern: ^mer-cus-[0-9]{3}$
      first_name:
        description: Customer's given name.
        required: true
        range: string
      last_name:
        description: Customer's family name.
        required: true
        range: string
      county:
        description: County from the customer's source address.
        required: true
        range: string
      status:
        description: Lifecycle status of the customer record.
        required: true
        range: CustomerStatus
      has_auto_loan:
        description: >-
          References (by id) to the customer's AutoLoans. This is optional
          because a Customer may have no auto loan in the governed corpus.
        range: AutoLoan
        multivalued: true
        inlined: false
      has_servicing_note:
        description: >-
          References (by id) to ServicingNotes attributable to this Customer.
        range: ServicingNote
        multivalued: true
        inlined: false

  AutoLoan:
    is_a: OperationalEntity
    description: >-
      A Meridian auto loan connected from its Customer and carrying the bounded
      servicing attributes used by the disaster-hardship control.
    attributes:
      loan_identifier:
        description: Stable Meridian auto-loan identifier.
        required: true
        range: string
        pattern: ^mer-loan-[0-9]{3}$
      status:
        description: Current servicing status of the auto loan.
        required: true
        range: AutoLoanStatus
      principal_balance_cents:
        description: Outstanding principal balance in integer cents.
        required: true
        range: integer
        minimum_value: 0
      next_due_date:
        description: Next payment due date recorded on the auto loan.
        required: true
        range: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      has_payment_schedule:
        description: >-
          References (by id) to PaymentSchedules belonging to this AutoLoan.
        required: true
        range: PaymentSchedule
        multivalued: true
        inlined: false
      has_servicing_note:
        description: >-
          References (by id) to ServicingNotes attributable to this AutoLoan.
        required: true
        range: ServicingNote
        multivalued: true
        inlined: false

  PaymentSchedule:
    is_a: OperationalEntity
    description: >-
      A scheduled Meridian auto-loan payment used to determine whether an unpaid
      payment falls inside the governed due-date window.
    attributes:
      payment_identifier:
        description: Stable Meridian payment-schedule identifier.
        required: true
        range: string
        pattern: ^mer-pay-[0-9]{3}$
      due_date:
        description: Date on which the payment is due.
        required: true
        range: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      amount_cents:
        description: Scheduled payment amount in integer cents.
        required: true
        range: integer
        minimum_value: 0
      status:
        description: Current state of the scheduled payment.
        required: true
        range: PaymentScheduleStatus

  ServicingNote:
    is_a: OperationalEntity
    description: >-
      A Meridian servicing note whose typed classification supplies the recorded
      hardship-offer or repossession fact used by the eligibility path.
    attributes:
      note_identifier:
        description: Stable Meridian servicing-note identifier.
        required: true
        range: string
        pattern: ^mer-note-[0-9]{3}$
      ticket_identifier:
        description: Stable Meridian servicing-ticket identifier carried by the note.
        required: true
        range: string
        pattern: ^mer-tkt-[0-9]{3}$
      note_type:
        description: Typed servicing fact recorded by the note.
        required: true
        range: ServicingNoteType
      created_date:
        description: Date the servicing note was created.
        required: true
        range: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      text:
        description: Source-authored servicing note text.
        required: true
        range: string

  OperationalRecordSet:
    tree_root: true
    description: >-
      Top-level container binding a set of operational entities together — the
      root of a validated operational graph. Used as the JSON Schema root class.
    attributes:
      accounts:
        description: The Accounts in this record set.
        range: Account
        multivalued: true
        inlined_as_list: true
      people:
        description: The People in this record set.
        range: Person
        multivalued: true
        inlined_as_list: true
      documents:
        description: The Documents in this record set.
        range: Document
        multivalued: true
        inlined_as_list: true
      tickets:
        description: The Tickets in this record set.
        range: Ticket
        multivalued: true
        inlined_as_list: true
      orders:
        description: The Orders in this record set.
        range: Order
        multivalued: true
        inlined_as_list: true
      customers:
        description: The Meridian Customers in this record set.
        range: Customer
        multivalued: true
        inlined_as_list: true
      auto_loans:
        description: The Meridian AutoLoans in this record set.
        range: AutoLoan
        multivalued: true
        inlined_as_list: true
      payment_schedules:
        description: The Meridian PaymentSchedules in this record set.
        range: PaymentSchedule
        multivalued: true
        inlined_as_list: true
      servicing_notes:
        description: The Meridian ServicingNotes in this record set.
        range: ServicingNote
        multivalued: true
        inlined_as_list: true

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------
enums:
  AccountStatus:
    description: Lifecycle status of an Account relationship.
    permissible_values:
      prospect:
        description: A potential customer not yet closed.
      active:
        description: A current, active customer.
      churned:
        description: A former customer that has lapsed or cancelled.

  DocumentType:
    description: The kind of a Document.
    permissible_values:
      contract:
        description: A legal agreement or contract.
      invoice:
        description: A billing invoice.
      report:
        description: An analytical or status report.
      policy:
        description: An internal policy or governance document.
      presentation:
        description: A slide deck or presentation.
      correspondence:
        description: Email or letter correspondence.
      other:
        description: Any document that does not fit the other types.

  TicketStatus:
    description: Workflow status of a Ticket.
    permissible_values:
      open:
        description: Newly opened and not yet being worked.
      pending:
        description: Awaiting input (from requester or a third party).
      resolved:
        description: A resolution has been provided.
      closed:
        description: Closed; no further action expected.

  TicketPriority:
    description: Priority level of a Ticket.
    permissible_values:
      low:
        description: Low priority.
      normal:
        description: Normal/default priority.
      high:
        description: High priority.
      urgent:
        description: Urgent; requires immediate attention.

  OrderStatus:
    description: Fulfillment status of an Order.
    permissible_values:
      draft:
        description: Not yet placed; still being composed.
      placed:
        description: Submitted/placed but not yet fulfilled.
      fulfilled:
        description: Fully delivered/fulfilled.
      cancelled:
        description: Cancelled before fulfillment.
      refunded:
        description: Refunded after placement.

  CustomerStatus:
    description: Lifecycle status of a Meridian Customer record.
    permissible_values:
      active:
        description: Customer is active.
      inactive:
        description: Customer is inactive.

  AutoLoanStatus:
    description: Servicing status of a Meridian AutoLoan.
    permissible_values:
      active:
        description: Loan is active.
      paid_off:
        description: Loan has been paid in full.
      repossession:
        description: Loan is in repossession status.

  PaymentScheduleStatus:
    description: State of a Meridian PaymentSchedule.
    permissible_values:
      scheduled:
        description: Payment remains scheduled and unpaid.
      paid:
        description: Payment has been paid.
      cancelled:
        description: Payment schedule row was cancelled.

  ServicingNoteType:
    description: Typed fact recorded by a Meridian ServicingNote.
    permissible_values:
      contact:
        description: Customer-contact fact without a hardship offer.
      hardship_offered:
        description: A hardship option was offered.
      repossession:
        description: Repossession activity was recorded.
      resolution:
        description: A servicing resolution was recorded.
