[project]
name = "ne-secrets"
version = "0.1.0"
description = "SecretStore interface and implementations."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["ne-contracts"]

[project.entry-points."ne.plugins.secret_store"]
sops-file = "ne.secrets.file_store:FileSecretStore"
openbao = "ne.secrets.openbao:OpenBaoSecretStore"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ne.secrets"
namespace = true

[tool.uv.sources]
ne-contracts = { workspace = true }
