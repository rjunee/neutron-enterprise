[project]
name = "ne-schema-bootstrap"
version = "0.1.0"
description = "Engagement schema bootstrap: bounded sample profiling + deterministic candidate-model inference (no LLM, no network, no linkml)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.13.4,<3",
    "pyyaml>=6.0.3,<7",
    "ne-schema",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ne.schema_bootstrap"
namespace = true

[tool.uv.sources]
ne-schema = { workspace = true }
